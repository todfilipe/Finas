<svg xmlns="http://www.w3.org/2000/svg" width="640" height="552" viewBox="0 0 640 552" role="img" aria-labelledby="title desc"><title id="title">Três passos, e já está.</title><desc id="desc">Escreves no Telegram. A IA interpreta e o backend valida e guarda. Consultas e editas na dashboard.</desc><rect width="640" height="552" fill="#FFFFFF"/><g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="12" width="608" height="160" rx="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><rect x="36" y="34" width="48" height="38" rx="19" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="60" y="60" fill="#000000" font-size="20" font-weight="400" text-anchor="middle">01</text><text x="104" y="61" fill="#000000" font-size="34" font-weight="700" letter-spacing="-1">Escreves</text><text x="36" y="111" fill="#000000" font-size="26" font-weight="400" >Uma frase normal no Telegram.</text><text x="36" y="146" fill="#000000" font-size="26" font-weight="400" >Despesas, receitas ou uma correção.</text><rect x="16" y="192" width="608" height="160" rx="28" fill="#000000" stroke="#000000" stroke-width="2"/><rect x="36" y="214" width="48" height="38" rx="19" fill="#000000" stroke="#FFFFFF" stroke-width="2"/><text x="60" y="240" fill="#FFFFFF" font-size="20" font-weight="400" text-anchor="middle">02</text><text x="104" y="241" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-1">A IA interpreta</text><text x="36" y="291" fill="#FFFFFF" font-size="26" font-weight="400" >Valor, data e categoria.</text><text x="36" y="326" fill="#FFFFFF" font-size="26" font-weight="400" >O backend valida e guarda os dados.</text><rect x="16" y="372" width="608" height="160" rx="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><rect x="36" y="394" width="48" height="38" rx="19" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="60" y="420" fill="#000000" font-size="20" font-weight="400" text-anchor="middle">03</text><text x="104" y="421" fill="#000000" font-size="34" font-weight="700" letter-spacing="-1">Vês tudo</text><text x="36" y="471" fill="#000000" font-size="26" font-weight="400" >Abres a dashboard pelo bot.</text><text x="36" y="506" fill="#000000" font-size="26" font-weight="400" >Consultas, filtras e editas.</text></g></svg>
