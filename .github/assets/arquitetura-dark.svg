<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">Por dentro do Finas</title><desc id="desc">Telegram comunica com o bot. O bot chama a OpenAI e usa core para guardar dados. O navegador acede ao Nginx, ao Next.js e à API. Bot e API partilham core e PostgreSQL.</desc><rect width="640" height="860" fill="#000000"/><g font-family="Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/></marker></defs><g fill="none" stroke="#FFFFFF" stroke-width="2.5" marker-end="url(#arrow)"><path d="M176 118 V152"/><path d="M464 118 V152"/><path d="M464 242 V276"/><path d="M464 366 V400"/><path d="M176 242 V276" marker-start="url(#arrow)"/><path d="M56 197 H24 V558 H60"/><path d="M464 490 V520"/><path d="M320 616 V680" marker-start="url(#arrow)"/></g><rect x="56" y="28" width="240" height="90" rx="28" fill="#000000" stroke="#FFFFFF" stroke-width="2"/><text x="176" y="66" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="-0.7">Telegram</text><text x="176" y="97" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">mensagens</text><rect x="344" y="28" width="240" height="90" rx="28" fill="#000000" stroke="#FFFFFF" stroke-width="2"/><text x="464" y="66" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="-0.7">Navegador</text><text x="464" y="97" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">dashboard web</text><rect x="56" y="152" width="240" height="90" rx="28" fill="#000000" stroke="#FFFFFF" stroke-width="2"/><text x="176" y="190" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="-0.7">Bot Python</text><text x="176" y="221" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">polling</text><r